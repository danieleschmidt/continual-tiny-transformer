[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "continual-tiny-transformer"
version = "0.1.0"
description = "Small transformer with Elastic Weight Consolidation for continual learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["continual_transformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
